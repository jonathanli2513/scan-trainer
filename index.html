<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scan Trainer" />
  <title>Scan Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #F4569A;
      --yellow: #F5C842;
      --bg: #0d0d0d;
      --surface: #181818;
      --surface2: #222;
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.16);
      --text: #e8e8e8;
      --muted: rgba(255,255,255,0.38);
      --panel-h: 260px;
      --panel-h-land: 200px;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'DM Mono', monospace;
      -webkit-font-smoothing: antialiased;
      color: var(--text);
    }

    /* ═══════════════════════════════
       COLOUR PANEL — full bleed
    ═══════════════════════════════ */
    #colour-panel {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: background 0.08s ease;
      z-index: 0;
      /* reserve space at bottom for control strip */
      padding-bottom: var(--panel-h);
    }

    /* In landscape, control strip goes to the right */
    @media (orientation: landscape) {
      #colour-panel {
        padding-bottom: 0;
        padding-right: var(--panel-h-land);
      }
    }

    /* running state — panel is fully active */
    body.running #colour-panel {
      padding-bottom: 80px; /* just timer bar + minimal strip */
    }

    @media (orientation: landscape) {
      body.running #colour-panel {
        padding-bottom: 0;
        padding-right: 80px;
      }
    }

    #colour-word {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(72px, 22vw, 200px);
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(0,0,0,0.28);
      user-select: none;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    body.running #colour-word { opacity: 1; }

    #idle-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      user-select: none;
      transition: opacity 0.2s;
    }

    body.running #idle-label { opacity: 0; pointer-events: none; }

    /* ═══════════════════════════════
       TIMER BAR — bottom of screen
    ═══════════════════════════════ */
    #bar-strip {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--panel-h);
      height: 8px;
      background: rgba(255,255,255,0.06);
      z-index: 10;
      transition: bottom 0.35s cubic-bezier(.4,0,.2,1);
    }

    body.running #bar-strip { bottom: 0; }

    @media (orientation: landscape) {
      #bar-strip {
        left: auto;
        right: var(--panel-h-land);
        bottom: 0;
        top: 0;
        width: 8px;
        height: auto;
      }
      body.running #bar-strip {
        right: 0;
        bottom: 0;
      }
    }

    #timer-bar {
      height: 100%;
      width: 100%;
      background: rgba(255,255,255,0.25);
      transform-origin: left center;
      transition: width 0.05s linear, background 0.1s ease;
    }

    @media (orientation: landscape) {
      #timer-bar {
        width: 100%;
        height: 100%;
        transform-origin: bottom center;
      }
    }

    /* ═══════════════════════════════
       CONTROL PANEL — slides up
    ═══════════════════════════════ */
    #control-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--panel-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      gap: 12px;
      transition: transform 0.35s cubic-bezier(.4,0,.2,1);
    }

    body.running #control-panel {
      transform: translateY(100%);
    }

    /* Running mini-strip — visible when running */
    #running-strip {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      padding: 0 20px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease 0.1s;
    }

    body.running #running-strip {
      opacity: 1;
      pointer-events: all;
    }

    @media (orientation: landscape) {
      #control-panel {
        left: auto;
        right: 0;
        top: 0;
        bottom: 0;
        height: auto;
        width: var(--panel-h-land);
        border-top: none;
        border-left: 1px solid var(--border);
        padding: 24px 16px;
        padding-right: calc(16px + env(safe-area-inset-right, 0px));
        overflow-y: auto;
        transition: transform 0.35s cubic-bezier(.4,0,.2,1);
      }

      body.running #control-panel {
        transform: translateX(100%);
      }

      #running-strip {
        left: auto;
        right: 0;
        top: 0;
        bottom: 0;
        height: auto;
        width: 72px;
        flex-direction: column;
        justify-content: center;
        padding: 20px 0;
        padding-right: env(safe-area-inset-right, 0px);
      }

      #bar-strip {
        right: var(--panel-h-land);
        left: auto;
        top: 0;
        bottom: 0;
        width: 8px;
        height: auto;
      }

      body.running #bar-strip {
        right: 72px;
        width: 8px;
        height: auto;
      }

      #timer-bar {
        width: 100%;
        height: 100%;
      }
    }

    /* ── Countdown in running strip ── */
    #run-countdown {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
      min-width: 70px;
    }

    #stop-btn-run {
      padding: 10px 24px;
      border-radius: 10px;
      border: 1px solid var(--border2);
      background: rgba(255,255,255,0.07);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    #stop-btn-run:active { transform: scale(0.97); background: rgba(255,255,255,0.12); }

    @media (orientation: landscape) {
      #run-countdown { font-size: 20px; min-width: auto; text-align: center; }
      #stop-btn-run { padding: 8px 12px; font-size: 10px; }
    }

    /* ── Settings inside control panel ── */
    .panel-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .settings-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .setting-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .setting-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .num-input {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
      width: 60px;
      padding: 5px 6px;
    }

    .num-input::-webkit-inner-spin-button,
    .num-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .num-input:focus { border-color: rgba(255,255,255,0.32); }
    .num-input:disabled { opacity: 0.28; }

    .input-unit {
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* toggle */
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      cursor: pointer;
      display: inline-block;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 999px;
      transition: background 0.2s, border-color 0.2s;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.2s, background 0.2s;
    }

    .toggle input:checked ~ .toggle-track {
      background: rgba(244,86,154,0.2);
      border-color: rgba(244,86,154,0.55);
    }

    .toggle input:checked ~ .toggle-thumb {
      transform: translateX(18px);
      background: var(--pink);
    }

    #random-range {
      display: none;
      align-items: center;
      gap: 6px;
    }

    #random-range.visible { display: flex; }

    .range-sep {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    /* start button */
    #start-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    #start-btn:hover { background: rgba(255,255,255,0.1); }
    #start-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <!-- Full bleed colour panel -->
  <div id="colour-panel">
    <div id="idle-label">Scan Trainer</div>
    <div id="colour-word">Pink</div>
  </div>

  <!-- Timer bar -->
  <div id="bar-strip">
    <div id="timer-bar"></div>
  </div>

  <!-- Minimal strip shown while running -->
  <div id="running-strip">
    <div id="run-countdown">—</div>
    <button id="stop-btn-run" onclick="stopDrill()">Stop</button>
  </div>

  <!-- Settings control panel -->
  <div id="control-panel">
    <div class="panel-title">Scan Trainer</div>

    <div class="settings-grid">

      <div class="setting-row">
        <span class="setting-label">Interval</span>
        <div class="setting-right">
          <input type="number" class="num-input" id="interval-input" value="3" min="1" max="60" />
          <span class="input-unit">sec</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="setting-row">
        <span class="setting-label">Randomise</span>
        <label class="toggle">
          <input type="checkbox" id="random-toggle" onchange="toggleRandom()" />
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>

      <div id="random-range">
        <span class="range-sep">Min</span>
        <input type="number" class="num-input" id="rand-min" value="2" min="1" max="59" style="width:52px;font-size:17px;" />
        <span class="range-sep">— Max</span>
        <input type="number" class="num-input" id="rand-max" value="6" min="2" max="60" style="width:52px;font-size:17px;" />
        <span class="range-sep">sec</span>
      </div>

    </div>

    <button id="start-btn" onclick="startDrill()">Start drill</button>
  </div>

  <script>
    const TICK_MS = 50;

    let current = 'pink';
    let elapsed = 0;
    let currentInterval = 3000;
    let running = false;
    let ticker = null;

    const panel        = document.getElementById('colour-panel');
    const colourWord   = document.getElementById('colour-word');
    const bar          = document.getElementById('timer-bar');
    const barStrip     = document.getElementById('bar-strip');
    const runCountdown = document.getElementById('run-countdown');
    const intervalInp  = document.getElementById('interval-input');
    const randomToggle = document.getElementById('random-toggle');
    const randomRange  = document.getElementById('random-range');
    const randMin      = document.getElementById('rand-min');
    const randMax      = document.getElementById('rand-max');

    function toggleRandom() {
      const on = randomToggle.checked;
      randomRange.classList.toggle('visible', on);
      intervalInp.disabled = on;
    }

    /* Fixed: random between [mn, mx] inclusive, both in ms */
    function getNextInterval() {
      if (randomToggle.checked) {
        const mn = Math.max(1000, (parseInt(randMin.value) || 2) * 1000);
        const mx = Math.max(mn + 1000, (parseInt(randMax.value) || 6) * 1000);
        /* random integer ms in [mn, mx] */
        return mn + Math.floor(Math.random() * (mx - mn + 1));
      }
      const val = parseFloat(intervalInp.value) || 3;
      return Math.max(1000, Math.round(val * 1000));
    }

    function applyColour(c) {
      const isPink = c === 'pink';
      const col = isPink ? '#F4569A' : '#F5C842';
      panel.style.background = col;
      bar.style.background = isPink ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.22)';
      colourWord.textContent = isPink ? 'Pink' : 'Yellow';
      colourWord.style.color = isPink ? 'rgba(0,0,0,0.28)' : 'rgba(0,0,0,0.32)';
    }

    const isLandscape = () => window.matchMedia('(orientation: landscape)').matches;

    function tick() {
      elapsed += TICK_MS;
      const remaining = currentInterval - elapsed;
      const pct = Math.max(0, (currentInterval - elapsed) / currentInterval) * 100;

      /* bar drains: width in portrait, height in landscape */
      if (isLandscape()) {
        bar.style.width = '100%';
        bar.style.height = pct + '%';
      } else {
        bar.style.height = '100%';
        bar.style.width = pct + '%';
      }

      runCountdown.textContent = (Math.max(0, remaining) / 1000).toFixed(1) + 's';

      if (elapsed >= currentInterval) {
        elapsed = 0;
        current = current === 'pink' ? 'yellow' : 'pink';
        currentInterval = getNextInterval();
        applyColour(current);
      }
    }

    function startDrill() {
      if (running) return;
      running = true;
      current = 'pink';
      elapsed = 0;
      currentInterval = getNextInterval();
      applyColour('pink');

      /* reset bar */
      if (isLandscape()) { bar.style.width = '100%'; bar.style.height = '100%'; }
      else { bar.style.height = '100%'; bar.style.width = '100%'; }

      document.body.classList.add('running');
      ticker = setInterval(tick, TICK_MS);
    }

    function stopDrill() {
      if (!running) return;
      running = false;
      clearInterval(ticker);
      ticker = null;
      document.body.classList.remove('running');
      panel.style.background = 'var(--bg)';
      bar.style.width = '0%';
      bar.style.height = '0%';
      colourWord.textContent = 'Pink';
      colourWord.style.color = '';
      runCountdown.textContent = '—';
    }

    /* Keep bar orientation correct on rotation */
    window.addEventListener('orientationchange', () => {
      if (!running) return;
      bar.style.width = '100%';
      bar.style.height = '100%';
    });
  </script>
</body>
</html>
